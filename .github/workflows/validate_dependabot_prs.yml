name: Validate Breeze Dependabot updates

on:
  push:
    branches:
      - 'ci-validate-dependabot-prs'

permissions:
  contents: read

jobs:
  javascript:
    name: Check Windows installer frontend and QuickJS demo
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.27.0'
      - name: Check installer frontend
        working-directory: windows-installer
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Build QuickJS demo
        working-directory: rust/rquickjs_playground/pnpm_demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  installer:
    name: Build and test the Windows installer
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.27.0'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Build installer frontend
        working-directory: windows-installer
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test the installer with a small archive
        working-directory: windows-installer/src-tauri
        shell: bash
        run: |
          mkdir -p resources
          placeholder="$(mktemp)"
          printf 'Dependency validation\n' > "$placeholder"
          7z a resources/Release.7z "$placeholder"
          cargo test --locked --lib sevenz_roundtrip_with_long_paths

name: Refresh Breeze dependency lockfiles

on:
  push:
    branches:
      - codex/refresh-dependabot-lockfiles

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Refresh the application's Rust lockfile
        working-directory: rust
        run: |
          cargo update -p bytes --precise 1.12.2
          cargo update -p quinn-proto --precise 0.11.19
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.17
          cargo update -p webpki-root-certs -p webpki-roots
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Refresh the Windows installer's Rust lockfile
        working-directory: windows-installer/src-tauri
        run: |
          cargo update -p bytes --precise 1.12.2
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Inspect lockfile changes
        run: |
          git diff --check
          git diff --stat
          git diff --name-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: updated-rust-lockfiles
          path: |
            rust/Cargo.lock
            windows-installer/src-tauri/Cargo.lock
          if-no-files-found: error

  pnpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.27.0'
      - name: Refresh and build the Windows installer frontend
        working-directory: windows-installer
        run: |
          pnpm update --lockfile-only --ignore-scripts '@sveltejs/kit@2' 'svelte@5' 'postcss@8' 'vite@6.4.6'
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Refresh and build the QuickJS demo
        working-directory: rust/rquickjs_playground/pnpm_demo
        run: |
          pnpm update --lockfile-only --ignore-scripts 'axios@1.21.1' 'esbuild@0.28'
          pnpm install --frozen-lockfile
          pnpm build
      - name: Inspect lockfile changes
        run: |
          git diff --check
          git diff --stat
          git diff --name-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: updated-pnpm-lockfiles
          path: |
            windows-installer/package.json
            windows-installer/pnpm-lock.yaml
            rust/rquickjs_playground/pnpm_demo/package.json
            rust/rquickjs_playground/pnpm_demo/pnpm-lock.yaml
          if-no-files-found: error
